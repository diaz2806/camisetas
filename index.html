<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Camisetas">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<title>Camisetas</title>
<style>
:root{
  --paper:#000000; --surface:#141418; --ink:#F4F4F6; --mut:#8D8D98; --line:#26262D; --fill:#1F1F26;
  --acc:#60A5FA; --acc-ink:#000000; --pos:#34D399; --owe:#FBBF24; --neg:#F87171;
  --c-primo:#A78BFA; --c-amigos:#60A5FA; --c-familia:#F472B6;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --num:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Cabecera */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  padding:calc(var(--st) + 14px) 20px 10px;display:flex;align-items:center;gap:12px}
.top h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{background:none;border:0;padding:6px 0;color:var(--acc);font-size:16px;font-weight:500}
.round{width:34px;height:34px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;padding:0}
.round svg{width:16px;height:16px}

main{padding:4px 20px calc(96px + var(--sb));max-width:620px;margin:0 auto}

/* Barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:6px;
  padding:8px 12px calc(8px + var(--sb));background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:140px;background:none;border:0;border-radius:12px;padding:7px 0 5px;color:var(--mut);font-size:11px;font-weight:500}
.tabs svg{display:block;width:22px;height:22px;margin:0 auto 2px}
.tabs button.on{color:var(--acc)}

/* El número grande */
.hero{padding:10px 0 22px}
.hero-n{font-family:var(--num);font-weight:600;font-size:76px;line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero-n small{font-size:.42em;font-weight:500;margin-left:2px;letter-spacing:0}
.hero-n.pos{color:var(--pos)} .hero-n.neg{color:var(--neg)} .hero-n.owe{color:var(--owe)}
.hero-l{margin:8px 0 18px;color:var(--mut);font-size:15px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--pos));border-radius:2px;transition:width .4s ease}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0}
.figs div{min-width:0}
.figs dt{color:var(--mut);font-size:13px}
.figs dd{margin:2px 0 0;font-family:var(--num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.figs dd.owe{color:var(--owe)} .figs dd.inc{color:var(--acc)}

/* Listas */
.h2{display:flex;align-items:baseline;gap:10px;margin:26px 0 8px}
.h2 h2{font-size:17px;font-weight:650;margin:0;flex:1}
.h2 .aside{color:var(--mut);font-size:14px}
.list{background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;position:relative;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.row.has-dot+.row::before,.row.has-dot::before{left:56px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .n b{display:block;font-weight:600}
.row .n small{color:var(--mut);font-size:13px}
.row .n b.pos{color:var(--pos)} .row .n b.neg{color:var(--neg)}
.row .n small.owe{color:var(--owe)}
.row .s.wrap{white-space:normal}
.page{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 2px;line-height:1.1}
.page+.sub{color:var(--mut);margin:0 0 4px}
.flag{font-size:12px;font-weight:500;color:var(--acc);margin-left:6px}

/* Círculo de cobrado */
.dot{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #4A4A55;background:none;display:grid;place-items:center;padding:0;color:transparent;transition:background .15s,border-color .15s}
.dot svg{width:14px;height:14px}
.dot.on{background:var(--pos);border-color:var(--pos);color:#fff}

.state{font-size:14px;font-weight:500;color:var(--owe)}
.state.ok{color:var(--pos)}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:600;background:var(--acc);color:var(--acc-ink);margin-top:12px}
.btn.soft{background:var(--fill);color:var(--ink)}
.btn.danger{background:none;color:var(--neg);padding:12px}
.btn.text{background:none;color:var(--acc);padding:12px;font-weight:500}
.empty{color:var(--mut);padding:36px 4px;font-size:15px}
.note{color:var(--mut);font-size:14px;margin:10px 2px}

/* Hoja inferior */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s ease}
.sheet-body{position:relative;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;
  padding:10px 20px calc(20px + var(--sb));animation:up .26s cubic-bezier(.2,.8,.2,1);max-width:620px;width:100%;margin:0 auto}
.sheet-body h2{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:10px 0 18px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-x{position:absolute;right:16px;top:16px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

label.f{display:block;margin-bottom:14px}
label.f>span{display:block;color:var(--mut);font-size:13px;margin:0 2px 6px}
.in{width:100%;background:var(--fill);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--acc);background:var(--surface)}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea.in{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tog{border:0;background:var(--fill);border-radius:999px;padding:9px 14px;font-size:15px;user-select:none;cursor:pointer}
.tog.on{background:var(--acc);color:var(--acc-ink)}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px;line-height:1.2;font-weight:500;color:var(--mut)}
.seg button.on{background:var(--cc,var(--acc));color:#000}
.seg button[data-c=primo]{--cc:var(--c-primo)} .seg button[data-c=amigos]{--cc:var(--c-amigos)} .seg button[data-c=familia]{--cc:var(--c-familia)}
.cat-primo{color:var(--c-primo)!important} .cat-amigos{color:var(--c-amigos)!important} .cat-familia{color:var(--c-familia)!important}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--fill);font-size:20px;line-height:1}
.stepper b{font-family:var(--num);font-size:24px;min-width:16px;text-align:center}
.price{padding:4px 0 14px}
.price .big{font-family:var(--num);font-size:48px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.price .det{color:var(--mut);font-size:14px;margin-top:6px}
.price .det b{font-weight:600;color:var(--pos)}

.tarifa .row{cursor:default}
.tarifa input{width:86px;text-align:right;padding:9px 12px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 76px);transform:translate(-50%,8px);background:var(--ink);color:#000;
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top">
  <button class="link" id="back" hidden>Atrás</button>
  <h1 id="title">Camisetas</h1>
  <button class="link" id="topAction" hidden></button>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="pedidos" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M8 3 4 5.5 2.5 10l3 1.2V21h13V11.2l3-1.2L20 5.5 16 3c-.6 1.8-2.2 3-4 3S8.6 4.8 8 3Z"/></svg>Pedidos</button>
  <button data-tab="personas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.9.8 3.1 2.5 3.5 5.2"/></svg>Personas</button>
  <button data-tab="tarifa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 12.5V4a1 1 0 0 1 1-1h8.5L21 11.5 12.5 20 3 12.5Z"/><circle cx="8" cy="8" r="1.4"/></svg>Catálogos</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" data-act="close"></div><div class="sheet-body" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== Datos ===================== */
const KEY = 'camisetas-v1';
const TIPOS = {
  camiseta: 'Camiseta fútbol',
  chandalLargo: 'Chándal largo',
  conjuntoCorto: 'Conjunto entreno corto',
  chaquetaRetro: 'Chaqueta retro',
  nba: 'Camiseta NBA',
  otro: 'Otro (precio manual)'
};
const DEF_TARIFA = {
  camiseta: 9, dorsal: 2, parche: 1, mangaLarga: 6, retro: 6, nino: 3,
  chandalLargo: 21, conjuntoCorto: 15, chaquetaRetro: 21, nba: 15
};
const CATS = ['primo', 'amigos', 'familia'];
const DEF_NOMBRES = { primo: 'Amigos del primo', amigos: 'Amigos', familia: 'Familia' };
// Precios base por catálogo (dorsal, parches, retro, etc. son iguales en los tres)
const BASES_CAT = {
  primo:   { camiseta: 9,   chandalLargo: 21,   conjuntoCorto: 15, chaquetaRetro: 21, nba: 17 },
  amigos:  { camiseta: 8,   chandalLargo: 20,   conjuntoCorto: 14, chaquetaRetro: 20, nba: 15 },
  familia: { camiseta: 7.5, chandalLargo: 19.4, conjuntoCorto: 13, chaquetaRetro: 19, nba: 13.9 }
};
const tarifaCat = (c, base = DEF_TARIFA) => ({ ...base, ...BASES_CAT[c] });
const nuevasTarifas = (base = DEF_TARIFA) => Object.fromEntries(CATS.map(c => [c, { nombre: DEF_NOMBRES[c], ...tarifaCat(c, base) }]));
const TARIFA_LABELS = [
  ['camiseta', 'Camiseta (base)'], ['dorsal', 'Con dorsal (+)'], ['parche', 'Cada parche (+)'],
  ['mangaLarga', 'Manga larga (+)'], ['retro', 'Retro (+)'], ['nino', 'Talla niño (+)'],
  ['chandalLargo', 'Chándal largo'], ['conjuntoCorto', 'Conjunto entreno corto'],
  ['chaquetaRetro', 'Chaqueta retro'], ['nba', 'Camiseta NBA']
];

const DEF_PAYPAL = 3.99, DEF_EXTRA = 1;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const r2 = n => Math.round(n * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const eur = n => (n || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hoy = () => new Date().toISOString().slice(0, 10);

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.pedidos)) { return migraEstado(s); }
  } catch (e) {}
  return null;
}
function migraEstado(s) {
  if (!s.tarifas) { s.tarifas = nuevasTarifas({ ...DEF_TARIFA, ...(s.tarifa || {}) }); }
  delete s.tarifa;
  CATS.forEach(c => { s.tarifas[c] = { nombre: DEF_NOMBRES[c], ...tarifaCat(c), ...(s.tarifas[c] || {}) }; });
  s.personas = s.personas || {};
  s.pedidos = (s.pedidos || []).map(migra);
  return s;
}
/* Catálogo de cada persona (por defecto, amigos del primo) */
const catDe = persona => S.personas[(persona || '').trim()] || 'primo';
const tarifaDe = it => S.tarifas[it._cat || catDe(it.persona)];
function recalcularPersona(n) {
  let c = 0;
  S.pedidos.forEach(p => p.items.forEach(it => {
    if ((it.persona || '').trim() === n && !it.manual) { it.precio = precioTarifa(it); c++; }
  }));
  return c;
}
function migra(p) {
  if (p.paypal == null) p.paypal = DEF_PAYPAL;
  if (p.extraPersona == null) p.extraPersona = DEF_EXTRA;
  return p;
}
/* Personas de un pedido y si han pagado todo */
function personasPedido(p) {
  const m = new Map();
  p.items.forEach(i => { const n = (i.persona || '').trim(); if (!n) return;
    if (!m.has(n)) m.set(n, true); if (!i.cobrado) m.set(n, false); });
  return m; // nombre -> todoCobrado
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠️ No se pudo guardar'); }
}

/* Precio según tarifa */
function precioTarifa(it, t = tarifaDe(it)) {
  switch (it.tipo) {
    case 'camiseta':
      return r2(t.camiseta + (it.conDorsal ? t.dorsal : 0) + (it.parches || 0) * t.parche
        + (it.mangaLarga ? t.mangaLarga : 0) + (it.retro ? t.retro : 0) + (it.nino ? t.nino : 0));
    case 'chandalLargo': return t.chandalLargo;
    case 'conjuntoCorto': return t.conjuntoCorto;
    case 'chaquetaRetro': return t.chaquetaRetro;
    case 'nba': return t.nba;
    default: return 0;
  }
}
function desglose(it, t = tarifaDe(it)) {
  if (it.tipo !== 'camiseta') return TIPOS[it.tipo] || '';
  const p = [`base ${t.camiseta}`];
  if (it.conDorsal) p.push(`dorsal +${t.dorsal}`);
  if (it.parches) p.push(`${it.parches} parche${it.parches > 1 ? 's' : ''} +${r2(it.parches * t.parche)}`);
  if (it.mangaLarga) p.push(`manga larga +${t.mangaLarga}`);
  if (it.retro) p.push(`retro +${t.retro}`);
  if (it.nino) p.push(`niño +${t.nino}`);
  return p.join(' · ');
}
function nuevoItem(d = {}) {
  const it = {
    id: uid(), desc: '', persona: '', talla: '', dorsal: '', tipo: 'camiseta',
    conDorsal: false, parches: 0, mangaLarga: false, retro: false, nino: false,
    coste: 0, manual: false, precio: 0, cobrado: false, ...d
  };
  it.coste = num(it.coste); it.parches = Math.max(0, parseInt(it.parches) || 0);
  if (d.precio != null && d.manual == null) it.manual = true; // si viene precio explícito, es manual
  if (!it.manual) it.precio = precioTarifa(it); else it.precio = num(it.precio);
  return it;
}
function totales(p) {
  const coste = r2(p.items.reduce((a, i) => a + num(i.coste), 0) + num(p.tarifaProc) + num(p.paypal));
  const ex = num(p.extraPersona), pp = personasPedido(p);
  const venta = r2(p.items.reduce((a, i) => a + num(i.precio), 0) + pp.size * ex);
  const cobrado = r2(p.items.filter(i => i.cobrado).reduce((a, i) => a + num(i.precio), 0)
    + [...pp.values()].filter(Boolean).length * ex);
  return { coste, venta, cobrado, pendiente: r2(venta - cobrado), dif: r2(venta - coste) };
}
function totalesGlobal() {
  const t = { coste: 0, venta: 0, cobrado: 0, pendiente: 0, dif: 0, pendProv: 0 };
  S.pedidos.forEach(p => {
    const x = totales(p);
    for (const k in x) t[k] = r2(t[k] + x[k]);
    if (!p.pagadoProveedor) t.pendProv = r2(t.pendProv + x.coste);
  });
  return t;
}

/* Pedido inicial (foto del proveedor del 10/11/2026) */
function seed() {
  const items = [
    { desc: 'Conjunto negro/dorado (camiseta + pantalón)', talla: 'L', tipo: 'conjuntoCorto', coste: 12 },
    { desc: 'Chándal Brasil', talla: 'XL', tipo: 'chandalLargo', coste: 18.4 },
    { desc: 'Ajax', talla: 'M', dorsal: 'Promes 11', conDorsal: true, coste: 8.5 },
    { desc: 'Valladolid', talla: 'L', coste: 6.5 },
    { desc: 'Blazers NBA', talla: 'M', dorsal: 'Morant 1', tipo: 'nba', coste: 12.9 },
    { desc: 'Deportivo', talla: 'M', dorsal: 'Aubameyang 7', conDorsal: true, coste: 8.5 },
    { desc: 'Camiseta azul (escudo león)', talla: 'M', dorsal: 'Cench 23', conDorsal: true, coste: 8.5 },
    { desc: 'Bayern', talla: 'M', coste: 6.5 },
    { desc: 'Liverpool', talla: 'M', dorsal: 'Victor M.V. 23', conDorsal: true, coste: 8.5 },
    { desc: 'Valladolid', talla: 'S', dorsal: 'I. Alejo 14', conDorsal: true, parches: 1, coste: 9 },
    { desc: 'Real Madrid', talla: 'S', dorsal: 'C. Espí 19', conDorsal: true, parches: 1, coste: 9 }
  ].map(nuevoItem);
  return { id: uid(), nombre: 'Pedido 10 nov 2026', fecha: '2026-11-10', tarifaProc: 3, paypal: DEF_PAYPAL, extraPersona: DEF_EXTRA, pagadoProveedor: false, items };
}

let S = load();
if (!S) { S = { tarifas: nuevasTarifas(), personas: {}, pedidos: [] }; S.pedidos.push(seed()); save(); }

/* ===================== UI ===================== */
const ui = { tab: 'pedidos', pedidoId: null };
const $ = s => document.querySelector(s);
const view = $('#view');

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }

function header(title, action, back) {
  $('#title').textContent = title;
  const a = $('#topAction');
  a.hidden = !action; a.onclick = action ? action.fn : null;
  if (action) { a.innerHTML = action.icon ? ICON_PLUS : esc(action.label); a.className = action.icon ? 'round' : 'link'; a.setAttribute('aria-label', action.label); }
  const b = $('#back'); b.hidden = !back; b.onclick = back || null;
  b.innerHTML = '‹ ' + esc(back && back.label ? back.label : 'Atrás');
}
const ICON_PLUS = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2.5v11M2.5 8h11"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>';

/* Número grande con céntimos pequeños */
function bigEur(n, sign) {
  const neg = n < 0, a = Math.abs(n);
  const [e, c] = a.toFixed(2).split('.');
  const ent = Number(e).toLocaleString('es-ES');
  return `${sign ? (neg ? '−' : '+') : (neg ? '−' : '')}${ent}<small>,${c} €</small>`;
}
function heroHTML(t, label) {
  const pct = t.venta > 0 ? Math.round(t.cobrado / t.venta * 100) : 0;
  return `<section class="hero">
    <div class="hero-n ${t.dif >= 0 ? 'pos' : 'neg'}">${bigEur(t.dif, true)}</div>
    <p class="hero-l">${label}</p>
    <div class="bar" title="Cobrado ${pct}%"><span style="width:${pct}%"></span></div>
    <dl class="figs">
      <div><dt>Pagas</dt><dd>${eur(t.coste)}</dd></div>
      <div><dt>Cobras</dt><dd class="inc">${eur(t.venta)}</dd></div>
      <div><dt>Por cobrar</dt><dd class="${t.pendiente > 0 ? 'owe' : ''}">${eur(t.pendiente)}</dd></div>
    </dl>
  </section>`;
}

function render() {

  if (ui.tab === 'pedidos') ui.pedidoId ? renderPedido() : renderPedidos();

}

function fechaBonita(f) {

}

function itemRow(it, extraSub = '') {

function findItem(id) {
  for (const p of S.pedidos) { const it = p.items.find(i => i.id === id); if (it) return { p, it }; }

/* ---- Personas ---- */
const SIN = '\u0000sin';
function renderPersonas() {
  header('Personas');
  const map = new Map();
  S.pedidos.forEach(p => p.items.forEach(it => {
    const k = (it.persona || '').trim() || SIN;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push({ p, it });
  }));
  const extras = new Map();
  S.pedidos.forEach(p => personasPedido(p).forEach((ok, n) => {
    const e = extras.get(n) || { total: 0, pend: 0 }; const ex = num(p.extraPersona);
    e.total = r2(e.total + ex); if (!ok) e.pend = r2(e.pend + ex); extras.set(n, e);
  }));
  const arr = [...map.entries()].map(([n, xs]) => {
    const e = extras.get(n) || { total: 0, pend: 0 };
    const total = r2(xs.reduce((a, x) => a + num(x.it.precio), 0) + e.total);
    const pend = r2(xs.filter(x => !x.it.cobrado).reduce((a, x) => a + num(x.it.precio), 0) + e.pend);
    return { n, xs, total, pend };
  }).sort((a, b) => (a.n === SIN) - (b.n === SIN) || b.pend - a.pend || a.n.localeCompare(b.n));
  if (!arr.length) { view.innerHTML = `<p class="empty">Cuando asignes prendas a alguien, aparecerá aquí.</p>`; return; }
  const totalPend = r2(arr.filter(x => x.n !== SIN).reduce((a, x) => a + x.pend, 0));
  const deudores = arr.filter(x => x.n !== SIN && x.pend > 0).length;
  view.innerHTML = `<section class="hero">
      <div class="hero-n ${totalPend > 0 ? 'owe' : 'pos'}">${bigEur(totalPend)}</div>
      <p class="hero-l">${totalPend > 0 ? (deudores === 1 ? 'Te debe 1 persona' : `Te deben ${deudores} personas`) : 'Nadie te debe nada'}</p>
    </section>`
    + arr.map(g => {
      const sin = g.n === SIN;
      return `<div class="h2"><h2>${sin ? 'Sin asignar' : esc(g.n)}</h2>
        ${sin ? `<span class="aside">${g.xs.length} prendas</span>` : `<button class="link cat-${catDe(g.n)}" style="font-size:14px" data-act="cambiarCatPersona" data-n="${esc(g.n)}">${esc(S.tarifas[catDe(g.n)].nombre)}</button>
        <span class="state ${g.pend > 0 ? '' : 'ok'}">${g.pend > 0 ? 'debe ' + eur(g.pend) : 'al día'}</span>`}</div>
      <div class="list">${g.xs.map(x => itemRow(x.it, S.pedidos.length > 1 ? esc(x.p.nombre) + ', ' : '')).join('')}</div>
      ${!sin && extras.has(g.n) ? `<p class="note">Incluye ${eur(extras.get(g.n).total)} de PayPal.</p>` : ''}
      ${g.pend > 0 && !sin ? `<button class="btn text" data-act="cobrarPersona" data-n="${esc(g.n)}">Marcar todo como cobrado</button>` : ''}`;
    }).join('');
}

function paintItemDyn() {
  const d = draft, t = tarifaDe(d);
  $('#catSel').innerHTML = `<div class="seg" style="margin-top:-4px">${CATS.map(c => `<button class="${c === d._cat ? 'on' : ''}" data-act="setCat" data-c="${c}">${esc(S.tarifas[c].nombre)}</button>`).join('')}</div>`;

      <button data-act="parche" data-d="-1" aria-label="Quitar parche">−</button><b>${d.parches || 0}</b><button data-act="parche" data-d="1" aria-label="Añadir parche">+</button></div></label>` : '';
  const pt = precioTarifa(d);
  const precio = d.manual ? num(d.precio) : pt;

    </div>
    <div class="toggles">
      <button class="tog ${d.manual ? 'on' : ''}" data-tog="manual">Precio manual</button>
      <button class="tog" data-act="aCoste">A precio de coste</button>

/* ===================== Eventos ===================== */
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  if (ui.tab === b.dataset.tab && b.dataset.tab === 'pedidos') ui.pedidoId = null;
  ui.tab = b.dataset.tab; render();
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f && draft) {
    const f = el.dataset.f;
    draft[f] = el.value;
    if (f === 'persona') {
      const n = el.value.trim();
      if (S.personas[n]) draft._cat = S.personas[n];
      paintItemDyn();
    } else if (f === 'dorsal' && draft.tipo === 'camiseta') {
      const had = draft.conDorsal; draft.conDorsal = el.value.trim() !== '';
      if (had !== draft.conDorsal) paintItemDyn();
      else paintPriceOnly();
    } else if (f === 'tipo') paintItemDyn();
    else if (f === 'coste' || f === 'precio') paintPriceOnly();
  }
  if (el.dataset.tarifa) { S.tarifas[ui.cat || 'primo'][el.dataset.tarifa] = num(el.value); save(); }
  if (el.dataset.catnombre != null) { S.tarifas[ui.cat || 'primo'].nombre = el.value || DEF_NOMBRES[ui.cat || 'primo']; save();
    document.querySelectorAll('[data-act=verCat]').forEach(b => { b.textContent = S.tarifas[b.dataset.c].nombre; }); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.f === 'tipo' && draft) { draft.tipo = e.target.value; paintItemDyn(); }
  if (e.target.id === 'fileIn') leerCopia(e.target.files[0]);
});
function paintPriceOnly() {
  // repinta solo el bloque de precio sin perder el foco del input manual
  const focused = document.activeElement && document.activeElement.dataset.f === 'precio';
  if (focused) {
    const pt = precioTarifa(draft), precio = num(draft.precio), dif = r2(precio - num(draft.coste));
    const box = $('#precioBox .price');
    box.querySelector('.big').innerHTML = bigEur(precio);
    box.querySelector('.det').innerHTML = `Precio manual, tarifa ${eur(pt)}. Te quedan <b style="color:${dif >= 0 ? 'var(--pos)' : 'var(--neg)'}">${dif >= 0 ? '+' : ''}${eur(dif)}</b>`;
  } else paintItemDyn();
}

document.addEventListener('click', e => {
  const tog = e.target.closest('[data-tog]');
  if (tog && draft) {
    const k = tog.dataset.tog;
    draft[k] = !draft[k];
    if (k === 'manual' && draft.manual) draft.precio = precioTarifa(draft);
    if (k === 'cobrado') { tog.classList.toggle('on', draft.cobrado); return; }
    paintItemDyn(); return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'toggleCobrado') e.stopPropagation();
  const A = ACTIONS[act]; if (A) { e.preventDefault(); A(a); }
});

const ACTIONS = {
  close: closeSheet,
  open: a => { ui.pedidoId = a.dataset.id; render(); },
  provPagado: () => { const p = pedidoActual(); p.pagadoProveedor = !p.pagadoProveedor; save(); render(); },
  addItem: () => sheetItem(nuevoItem(), true),
  editItem: a => { const { it } = findItem(a.dataset.id); if (it) sheetItem(it, false); },
  toggleCobrado: a => { const { it } = findItem(a.dataset.id); if (it) { it.cobrado = !it.cobrado; save(); const y = scrollY; render(); scrollTo(0, y); } },
  parche: a => { draft.parches = Math.max(0, (draft.parches || 0) + num(a.dataset.d)); paintItemDyn(); },
  aCoste: () => { draft.manual = true; draft.precio = num(draft.coste); paintItemDyn(); },
  guardarItem: () => {
    const d = { ...draft }; const isNew = d._new, cat = d._cat; delete d._new; delete d._cat;
    d.persona = (d.persona || '').trim();
    let recalc = 0;
    if (d.persona && S.personas[d.persona] !== cat) {
      const habia = d.persona in S.personas;
      S.personas[d.persona] = cat;
      if (habia) recalc = recalcularPersona(d.persona);
    }
    d.coste = num(d.coste); d.parches = parseInt(d.parches) || 0;
    if (d.tipo !== 'camiseta') Object.assign(d, { conDorsal: false, parches: 0, mangaLarga: false, retro: false, nino: false });
    d.precio = d.manual ? num(d.precio) : precioTarifa(d);
    if (isNew) pedidoActual().items.push(d);
    else { const { p, it } = findItem(d.id); p.items[p.items.indexOf(it)] = d; }
    save(); closeSheet(); draft = null; const y = scrollY; render(); scrollTo(0, y);
    toast(recalc ? `${d.persona} pasa a ${S.tarifas[cat].nombre}: precios recalculados` : 'Guardado');
  },
  borrarItem: () => {
    if (!confirm('¿Borrar esta prenda?')) return;
    const { p, it } = findItem(draft.id); p.items.splice(p.items.indexOf(it), 1);
    save(); closeSheet(); draft = null; render();
  },
  crearPedido: () => {
    const p = { id: uid(), nombre: $('#pNombre').value.trim() || 'Pedido', fecha: $('#pFecha').value || hoy(), tarifaProc: num($('#pProc').value), paypal: num($('#pPaypal').value), extraPersona: num($('#pExtra').value), pagadoProveedor: false, items: [] };
    S.pedidos.push(p); save(); closeSheet(); ui.pedidoId = p.id; render();
  },
  importarPedido: () => {
    try {
      let j = JSON.parse($('#pJson').value);
      if (Array.isArray(j)) j = { items: j };
      if (j.pedido) j = j.pedido;
      if (!Array.isArray(j.items) || !j.items.length) throw new Error('sin items');
      const p = { id: uid(), nombre: j.nombre || 'Pedido importado', fecha: j.fecha || hoy(), tarifaProc: num(j.tarifaProc ?? 0), paypal: num(j.paypal ?? DEF_PAYPAL), extraPersona: num(j.extraPersona ?? DEF_EXTRA),
        pagadoProveedor: !!j.pagadoProveedor, items: j.items.map(i => nuevoItem({ ...i, id: uid() })) };
      S.pedidos.push(p); save(); closeSheet(); ui.pedidoId = p.id; render(); toast(`Importadas ${p.items.length} prendas`);
    } catch (err) { toast('⚠️ El texto no es un pedido válido'); }
  },
  guardarPedido: () => {
    const p = pedidoActual();
    p.nombre = $('#pNombre').value.trim() || p.nombre; p.fecha = $('#pFecha').value || p.fecha; p.tarifaProc = num($('#pProc').value);
    p.paypal = num($('#pPaypal').value); p.extraPersona = num($('#pExtra').value);
    save(); closeSheet(); render();
  },
  borrarPedido: () => {
    if (!confirm('¿Borrar el pedido entero?')) return;
    S.pedidos = S.pedidos.filter(p => p.id !== ui.pedidoId); ui.pedidoId = null; save(); closeSheet(); render();
  },
  cobrarPersona: a => {
    const n = a.dataset.n;
    if (!confirm(`¿Marcar todo lo de ${n} como cobrado?`)) return;
    S.pedidos.forEach(p => p.items.forEach(it => { if ((it.persona || '').trim() === n) it.cobrado = true; }));
    save(); render();
  },
  setCat: a => { draft._cat = a.dataset.c; if (draft.manual) {} paintItemDyn(); },
  verCat: a => { ui.cat = a.dataset.c; render(); },
  aplicarCat: () => {
    const cat = ui.cat || 'primo';
    if (!confirm(`¿Recalcular con estos precios todas las prendas de ${S.tarifas[cat].nombre}? (las de precio manual no se tocan)`)) return;
    let c = 0;
    S.pedidos.forEach(p => p.items.forEach(it => { if (catDe(it.persona) === cat && !it.manual) { it.precio = precioTarifa(it); c++; } }));
    save(); toast(`${c} prendas recalculadas`);
  },
  copiarCat: () => {
    const cat = ui.cat || 'primo';
    openSheet(`<h2>Copiar precios a ${esc(S.tarifas[cat].nombre)}</h2>
      ${CATS.filter(c => c !== cat).map(c => `<button class="btn soft" data-act="copiarDe" data-c="${c}">Desde ${esc(S.tarifas[c].nombre)}</button>`).join('')}
      <button class="btn soft" data-act="copiarDe" data-c="__def">Precios por defecto de este catálogo</button>`);
  },
  copiarDe: a => {
    const cat = ui.cat || 'primo', src = a.dataset.c === '__def' ? tarifaCat(cat) : S.tarifas[a.dataset.c];
    const { nombre, ...precios } = src;
    S.tarifas[cat] = { ...S.tarifas[cat], ...precios }; save(); closeSheet(); render(); toast('Precios copiados');
  },
  cambiarCatPersona: a => {
    const n = a.dataset.n;
    openSheet(`<h2>Catálogo de ${esc(n)}</h2>
      ${CATS.map(c => `<button class="btn ${catDe(n) === c ? '' : 'soft'}" data-act="fijarCatPersona" data-n="${esc(n)}" data-c="${c}">${esc(S.tarifas[c].nombre)}</button>`).join('')}
      <p class="note">Se recalculan sus prendas (menos las de precio manual).</p>`);
  },
  fijarCatPersona: a => {
    const n = a.dataset.n; S.personas[n] = a.dataset.c; const c = recalcularPersona(n);
    save(); closeSheet(); render(); toast(`${n}: ${S.tarifas[a.dataset.c].nombre} (${c} prendas)`);
  },
  exportar: async () => {
    const txt = JSON.stringify(S, null, 2);
    const name = `camisetas-${hoy()}.json`;
    const file = new File([txt], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(file); const l = document.createElement('a'); l.href = url; l.download = name; l.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
  importarCopia: () => $('#fileIn').click(),
  borrarTodo: () => {
    if (!confirm('Se borrarán TODOS los pedidos de este móvil. ¿Seguro?')) return;
    S = { tarifas: nuevasTarifas(), personas: {}, pedidos: [] }; save(); ui.pedidoId = null; render();
  }
};
function leerCopia(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!Array.isArray(j.pedidos)) throw 0;
      if (!confirm('Esto sustituye los datos actuales por los de la copia. ¿Seguir?')) return;
      S = migraEstado(j); save(); ui.pedidoId = null; render(); toast('Copia restaurada');
    } catch (e) { toast('⚠️ Archivo no válido'); }
  };
  r.readAsText(f);
}

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
